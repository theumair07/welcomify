name: Update WordPress.org assets and readme

# Manual only — run it from the Actions tab when you want to push new artwork
# or an updated readme description to WordPress.org WITHOUT cutting a release.
#
# Why not on every push: this action refuses to run when anything else in trunk
# differs from what is published, which is the normal state between releases.
# On a push trigger it would fail constantly. Run it right after a release, when
# trunk and main match.
on:
  workflow_dispatch:

jobs:
  assets:
    name: Sync assets and readme
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update assets and readme
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: welcomify
          ASSETS_DIR: .wordpress-org
