name: Feature request
description: Suggest an idea for Welcomify
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you run into, not just the feature.
      placeholder: "When I set up a site for a client, I have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Have you tried any workarounds?

  - type: dropdown
    id: builder
    attributes:
      label: Which page builder does this relate to?
      options:
        - Not builder specific
        - Gutenberg (Block Editor)
        - Elementor
        - Bricks
        - Divi
        - Beaver Builder
        - Breakdance
        - Oxygen
        - Other
    validations:
      required: true
